name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jdk-tests:
    # The test scripts use Windows paths, like build.ps1.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate public content and PR metadata
        shell: pwsh
        run: ./scripts/test-public-content.ps1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Run JDK-only tests
        shell: pwsh
        run: ./scripts/test-all.ps1
      - name: Build unsigned Android APK
        shell: pwsh
        run: ./build.ps1
